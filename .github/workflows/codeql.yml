name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze-actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
