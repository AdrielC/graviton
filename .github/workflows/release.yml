name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Validate and assemble
        run: ./sbt clean scalafmtCheckAll test verifyShardcakeDependencyGraph server/assembly
      - name: Exercise the packaged open and authenticated servers
        run: ./scripts/smoke-packaged-server.sh
      - name: Prove filesystem backup and restore
        run: ./scripts/verify-backup-restore.sh
      - name: Prove external consumption
        run: ./scripts/verify-external-consumer.sh
      - name: Audit publishable JAR contents
        run: ./scripts/audit-published-artifacts.sh
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd modules/server/graviton-server/target/scala-3.8.4
          sha256sum graviton-server-*.jar > SHA256SUMS
      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: modules/server/graviton-server/target/scala-3.8.4
          format: spdx-json
          output-file: modules/server/graviton-server/target/scala-3.8.4/graviton-server.spdx.json
          upload-artifact: false
      - name: Attest executable artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: modules/server/graviton-server/target/scala-3.8.4/graviton-server-*.jar
      - name: Upload release bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graviton-release
          path: |
            modules/server/graviton-server/target/scala-3.8.4/graviton-server-*.jar
            modules/server/graviton-server/target/scala-3.8.4/SHA256SUMS
            modules/server/graviton-server/target/scala-3.8.4/graviton-server.spdx.json
          if-no-files-found: error

  container:
    needs: validate-package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graviton-release
          path: modules/server/graviton-server/target/scala-3.8.4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/adrielc/graviton
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          platforms: linux/amd64,linux/arm64
      - name: Attest container image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/adrielc/graviton
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Sign immutable image digest with GitHub OIDC
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image="ghcr.io/adrielc/graviton@${DIGEST}"
          cosign sign --yes --bundle graviton-container.sigstore.json "${image}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "${image}"
          printf '%s\n' "${image}" > graviton-image.txt
      - name: Generate container SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/adrielc/graviton@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: graviton-container.spdx.json
          upload-artifact: false
      - name: Upload signed container release metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graviton-container-release
          path: |
            graviton-image.txt
            graviton-container.sigstore.json
            graviton-container.spdx.json
          if-no-files-found: error

  maven-central:
    needs: validate-package
    runs-on: ubuntu-latest
    env:
      PGP_SECRET: ${{ secrets.PGP_SECRET }}
      PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Require publication credentials and publish signed modules
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SONATYPE_USERNAME}" ] || [ -z "${SONATYPE_PASSWORD}" ] || [ -z "${PGP_SECRET}" ] || [ -z "${PGP_PASSPHRASE}" ]; then
            echo 'Maven Central and PGP credentials are required for a Graviton release.' >&2
            exit 1
          fi
          ./sbt versionCheck ci-release
      - name: Verify signed release artifacts and a Central-resolved consumer
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          artifacts=(
            graviton-bytes_3
            graviton-bytes_sjs1_3
            graviton-bytes_native0.5_3
            graviton-core_3
            graviton-streams_3
            graviton-shared_3
            graviton-shared_sjs1_3
            graviton-runtime_3
            graviton-backend-laws_3
            graviton-pdf_3
            graviton-shardcake_3
            graviton-admission-redis_3
            graviton-proto_3
            graviton-security_3
            graviton-grpc_3
            graviton-http_3
            graviton-s3_3
            graviton-pg_3
            graviton-rocks_3
          )

          for attempt in $(seq 1 45); do
            missing=()
            for artifact in "${artifacts[@]}"; do
              base="https://repo.maven.apache.org/maven2/io/github/adrielc/${artifact}/${version}/${artifact}-${version}"
              for suffix in .pom .jar -sources.jar -javadoc.jar; do
                for proof in "" .asc .sha1; do
                  if ! curl -fsSI --retry 2 "${base}${suffix}${proof}" >/dev/null; then
                    missing+=("${artifact}${suffix}${proof}")
                  fi
                done
              done
            done
            if [[ "${#missing[@]}" -eq 0 ]]; then
              break
            fi
            echo "Waiting for Maven Central: ${missing[*]}"
            sleep 20
          done

          if [[ "${#missing[@]}" -ne 0 ]]; then
            echo "Maven Central did not expose every signed Graviton ${version} artifact within 15 minutes." >&2
            exit 1
          fi

          GRAVITON_CONSUMER_VERSION="${version}" \
          GRAVITON_CONSUMER_REPOSITORY="https://repo.maven.apache.org/maven2" \
            ./scripts/verify-external-consumer.sh
          echo "Verified signed Graviton ${version} artifacts and an external Maven Central consumer."

  github-release:
    needs: [validate-package, container, maven-central]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graviton-release
          path: release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graviton-container-release
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ -f "${notes}" ]]; then
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --notes-file "${notes}"
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes
          fi
