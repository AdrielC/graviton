name: Production qualification

on:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: Git ref used only for the clean-state performance comparison (defaults to the newest reachable release tag)
        required: false
        type: string
  schedule:
    - cron: '17 7 * * 0'

permissions:
  contents: read

jobs:
  two-node-fault-and-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GRAVITON_REDIS_IT: '1'
      GRAVITON_REDIS_IT_PORT: '6379'
    services:
      redis:
        image: redis:8.10.1-alpine@sha256:becdda6c7f4b3fb42e42fd7f120bbf5c54c4caaaf16f26da24e4563d2c1f0576
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Retain CrashLab and tenant-isolation contract evidence
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/graviton-qualification"
          mkdir -p "$evidence"
          ./sbt \
            'backendLaws/testOnly graviton.backend.laws.CrashConsistencyLawsSpec' \
            'backendLaws/testOnly graviton.backend.laws.BlobStoreLawsSpec' \
            'runtime/testOnly graviton.runtime.stores.GarbageCollectorSpec graviton.runtime.stores.MaintenanceCoordinatorSpec' \
            2>&1 | tee "$evidence/crashlab.log"
          ./scripts/verify-backup-restore.sh > "$evidence/backup-restore.log"
          ./scripts/qualify-multitenant.sh "$evidence/multi-tenant" \
            > "$evidence/multi-tenant.json"
          printf '{"schema":"graviton-crashlab-v1","commit":"%s","status":"passed"}\n' \
            "$(git rev-parse HEAD)" > "$evidence/crashlab.json"
      - name: Validate and retain the portable observability contract
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/graviton-qualification/observability"
          mkdir -p "$evidence"
          ./scripts/validate-observability-bundle.py > "$evidence/validation.json"
          ./scripts/validate-qualification-contract.py > "$evidence/qualification-contract.json"
          cp deploy/observability-v1/slo.json "$evidence/slo.json"
          cp deploy/observability-v1/alert-routing.json "$evidence/alert-routing.json"
          cp deploy/observability-v1/grafana/dashboards/graviton-production.json "$evidence/dashboard.json"
          cp deploy/qualification-v1/matrix.json "$evidence/qualification-matrix.json"
      - name: Build exact baseline and candidate images
        env:
          REQUESTED_BASELINE_REF: ${{ inputs.baseline_ref }}
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/graviton-qualification"
          baseline_ref="$REQUESTED_BASELINE_REF"
          if [[ -z "$baseline_ref" ]]; then
            baseline_ref="$(git describe --tags --abbrev=0 HEAD^)"
          fi
          baseline_dir="$RUNNER_TEMP/graviton-baseline"
          git worktree add --detach "$baseline_dir" "$baseline_ref"
          (
            cd "$baseline_dir"
            TESTCONTAINERS=0 ./sbt -Dsbt.server.autostart=false -Dsbt.supershell=false 'server/assembly'
            docker build -t graviton-qualification:baseline .
          )
          TESTCONTAINERS=0 ./sbt -Dsbt.server.autostart=false -Dsbt.supershell=false 'server/assembly'
          docker build -t graviton-qualification:candidate .
          printf '{"schema":"graviton-rolling-images-v1","baselineRef":"%s","candidateRef":"%s"}\n' \
            "$(git -C "$baseline_dir" rev-parse HEAD)" "$(git rev-parse HEAD)" > "$evidence/rolling-images.json"
          git worktree remove "$baseline_dir"
      - name: Generate and mask manifest qualification key
        run: |
          set -euo pipefail
          key="$(openssl rand -base64 32 | tr -d '\n')"
          echo "::add-mask::$key"
          {
            echo 'GRAVITON_MANIFEST_INTEGRITY_REQUIRED=true'
            echo 'GRAVITON_MANIFEST_INTEGRITY_KEY_ID=qualification-v1'
            echo "GRAVITON_MANIFEST_INTEGRITY_HMAC_KEY_BASE64=$key"
          } >> "$GITHUB_ENV"
      - name: Start exact candidate two-node topology
        run: |
          set -euo pipefail
          compose='deploy/local-shardcake/docker-compose.yml'
          GRAVITON_MANAGER_IMAGE=graviton-qualification:candidate \
          GRAVITON_NODE_1_IMAGE=graviton-qualification:candidate \
          GRAVITON_NODE_2_IMAGE=graviton-qualification:candidate \
            docker compose -f "$compose" up -d --no-build
          for _ in $(seq 1 120); do
            if curl --fail --silent http://127.0.0.1:58081/api/health/ready >/dev/null \
              && curl --fail --silent http://127.0.0.1:58082/api/health/ready >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker compose -f "$compose" ps -a
          exit 1
      - name: Prove node and backend failure behavior
        run: |
          mkdir -p "$RUNNER_TEMP/graviton-qualification"
          ./scripts/qualify-local-shardcake.sh > "$RUNNER_TEMP/graviton-qualification/failure-proof.json"
      - name: Retain workload distributions, telemetry, and regression gate
        env:
          GRAVITON_BENCHMARK_BACKEND_DESCRIPTION: GitHub-hosted runner, MinIO, PostgreSQL, two Shardcake nodes
          GRAVITON_BENCHMARK_WARMUPS: '1'
          GRAVITON_GATE_TENANTS: '8'
          GRAVITON_GATE_SAMPLES_PER_TENANT: '16'
          GRAVITON_BENCHMARK_TENANT_ID: 00000000-0000-4000-8000-000000000605
          GRAVITON_BENCHMARK_SESSION_ID: 00000000-0000-4000-8000-000000000606
          GRAVITON_BENCHMARK_MEDIA_TYPE: application/octet-stream
        run: |
          evidence="$RUNNER_TEMP/graviton-qualification"
          corpus="$evidence/corpus"
          mkdir -p "$evidence/reuse-transition" "$evidence/benchmarks"
          ./scripts/generate-qualification-corpus.py "$corpus" > "$evidence/corpus-generation.json"

          ./scripts/benchmark-http.sh http://127.0.0.1:58081 "$corpus/base-32m.bin" > "$evidence/reuse-transition/01-base-fresh.json"
          ./scripts/benchmark-http.sh http://127.0.0.1:58081 "$corpus/sparse-edit-32m.bin" > "$evidence/reuse-transition/02-sparse-edit.json"
          ./scripts/benchmark-http.sh http://127.0.0.1:58081 "$corpus/base-32m.bin" > "$evidence/reuse-transition/03-base-duplicate.json"
          jq -e '.freshBlocks > 0 and .duplicateBlocks == 0' "$evidence/reuse-transition/01-base-fresh.json" >/dev/null
          jq -e '.freshBlocks > 0 and .duplicateBlocks > 0' "$evidence/reuse-transition/02-sparse-edit.json" >/dev/null
          jq -e '.freshBlocks == 0 and .duplicateBlocks > 0' "$evidence/reuse-transition/03-base-duplicate.json" >/dev/null

          for payload in base-32m sparse-edit-32m repeated-block-32m; do
            ./scripts/benchmark-suite.sh \
              http://127.0.0.1:58081 \
              "$corpus/$payload.bin" \
              8 \
              4 \
              "$evidence/benchmarks/$payload"
          done

          baseline_ref="$(jq -r '.baselineRef' "$evidence/rolling-images.json")"
          candidate_ref="$(jq -r '.candidateRef' "$evidence/rolling-images.json")"
          ./scripts/run-performance-cohort.sh \
            graviton-qualification:baseline \
            "$baseline_ref" \
            "$corpus/base-32m.bin" \
            "$evidence/performance-baseline"
          ./scripts/run-performance-cohort.sh \
            graviton-qualification:candidate \
            "$candidate_ref" \
            "$corpus/base-32m.bin" \
            "$evidence/performance-candidate"
          ./scripts/evaluate-performance-gate.py \
            "$evidence/performance-baseline/workload/summary.json" \
            "$evidence/performance-candidate/workload/summary.json" \
            "$evidence/performance-baseline/telemetry.json" \
            "$evidence/performance-candidate/telemetry.json" \
            "$evidence/performance-gate.json"
      - name: Reset to a clean strict candidate store
        run: |
          set -euo pipefail
          compose='deploy/local-shardcake/docker-compose.yml'
          docker compose -f "$compose" down --volumes --remove-orphans
          docker compose -f "$compose" up -d postgres minio minio-init
          jq -n \
            --arg schema graviton-clean-store-boundary-v1 \
            --arg candidate "$(git rev-parse HEAD)" \
            '{schema: $schema, candidate: $candidate, cleanStore: true, manifestFormat: "GVM4", proofVersion: 2, legacyBackfillRequired: false}' \
            > "$RUNNER_TEMP/graviton-qualification/clean-store-boundary.json"
      - name: Qualify same-version manager and node replacement
        run: |
          ./scripts/qualify-node-replacement.sh graviton-qualification:candidate "$(git rev-parse --short HEAD)" \
            > "$RUNNER_TEMP/graviton-qualification/node-replacement.json"
      - name: Run sustained resumable workload through repeated faults
        run: |
          ./scripts/qualify-long-failure.sh 3600 4194304 \
            > "$RUNNER_TEMP/graviton-qualification/long-failure.json"
      - name: Capture topology logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graviton-qualification"
          docker compose -f deploy/local-shardcake/docker-compose.yml ps -a > "$RUNNER_TEMP/graviton-qualification/compose-status.txt"
          docker compose -f deploy/local-shardcake/docker-compose.yml logs --no-color > "$RUNNER_TEMP/graviton-qualification/compose.log"
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/graviton-qualification
          if-no-files-found: error
          retention-days: 90
      - name: Stop topology
        if: always()
        run: docker compose -f deploy/local-shardcake/docker-compose.yml down -v --remove-orphans

  three-domain-erasure-loss:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Start exact three-domain erasure topology
        run: ./scripts/demo-three-domain.sh up
      - name: Destroy one storage volume and prove convergence
        run: |
          mkdir -p "$RUNNER_TEMP/graviton-three-domain"
          ./scripts/qualify-three-domain.sh > "$RUNNER_TEMP/graviton-three-domain/failure-proof.json"
          curl --fail --silent http://127.0.0.1:58181/metrics > "$RUNNER_TEMP/graviton-three-domain/metrics.prom"
          curl --fail --silent http://127.0.0.1:59090/api/v1/rules > "$RUNNER_TEMP/graviton-three-domain/prometheus-rules.json"
          curl --fail --silent http://127.0.0.1:59300/api/dashboards/uid/graviton-production-v1 > "$RUNNER_TEMP/graviton-three-domain/grafana-dashboard-live.json"
      - name: Capture retained topology evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/graviton-three-domain"
          curl --fail --silent http://127.0.0.1:58181/metrics > "$RUNNER_TEMP/graviton-three-domain/metrics.prom" || true
          curl --fail --silent http://127.0.0.1:59090/api/v1/rules > "$RUNNER_TEMP/graviton-three-domain/prometheus-rules.json" || true
          curl --fail --silent http://127.0.0.1:59300/api/dashboards/uid/graviton-production-v1 > "$RUNNER_TEMP/graviton-three-domain/grafana-dashboard-live.json" || true
          docker compose -f deploy/three-domain/docker-compose.yml ps -a > "$RUNNER_TEMP/graviton-three-domain/compose-status.txt"
          docker compose -f deploy/three-domain/docker-compose.yml logs --no-color > "$RUNNER_TEMP/graviton-three-domain/compose.log"
          cp deploy/observability-v1/grafana/dashboards/graviton-production.json "$RUNNER_TEMP/graviton-three-domain/dashboard.json"
          cp deploy/observability-v1/recording-rules.yml "$RUNNER_TEMP/graviton-three-domain/recording-rules.yml"
          cp deploy/observability-v1/alerts.yml "$RUNNER_TEMP/graviton-three-domain/alerts.yml"
          cp deploy/observability-v1/slo.json "$RUNNER_TEMP/graviton-three-domain/slo.json"
      - name: Upload three-domain qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: three-domain-erasure-${{ github.sha }}
          path: ${{ runner.temp }}/graviton-three-domain
          if-no-files-found: error
          retention-days: 90
      - name: Stop topology
        if: always()
        run: docker compose -f deploy/three-domain/docker-compose.yml down -v
