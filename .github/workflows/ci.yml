name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Scalafmt check
        run: ./sbt scalafmtCheckAll
      - name: Byte-streaming hygiene
        run: ./scripts/check-byte-streaming-hygiene.sh

  test:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS: '1'
      GRAVITON_IT: '1'
      GRAVITON_MINIO_IT: '1'
      PG_JDBC_URL: 'jdbc:postgresql://127.0.0.1:5432/postgres'
      PG_USERNAME: 'postgres'
      PG_PASSWORD: 'postgres'
      QUASAR_MINIO_URL: 'http://127.0.0.1:9000'
      MINIO_ROOT_USER: 'minio'
      MINIO_ROOT_PASSWORD: 'minioadmin'
      GRAVITON_S3_BLOCK_BUCKET: 'graviton-blocks'
      GRAVITON_S3_BLOCK_PREFIX: 'cas/blocks'
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Wait for Postgres + apply schema
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client curl
          for i in {1..60}; do
            if command -v psql >/dev/null 2>&1; then
              PGPASSWORD="${PG_PASSWORD}" psql -h 127.0.0.1 -U "${PG_USERNAME}" -d postgres -c "select 1" >/dev/null 2>&1 && break
            fi
            sleep 1
          done
          PGPASSWORD="${PG_PASSWORD}" psql -h 127.0.0.1 -U "${PG_USERNAME}" -d postgres -f modules/pg/ddl.sql
      - name: Start MinIO + create bucket
        run: |
          set -euo pipefail
          MINIO_IMAGE='minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e'
          MC_IMAGE='minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727'
          docker pull "${MINIO_IMAGE}"
          docker run -d --name minio \
            -p 9000:9000 \
            -p 9001:9001 \
            -e MINIO_ROOT_USER="${MINIO_ROOT_USER}" \
            -e MINIO_ROOT_PASSWORD="${MINIO_ROOT_PASSWORD}" \
            "${MINIO_IMAGE}" server /data --console-address ":9001"
          for i in {1..60}; do
            curl -sf "http://127.0.0.1:9000/minio/health/ready" >/dev/null && break
            sleep 1
          done
          docker run --rm --network host \
            -e "MC_HOST_local=http://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000" \
            "${MC_IMAGE}" mb --ignore-existing "local/${GRAVITON_S3_BLOCK_BUCKET}"
      - name: Test
        run: ./sbt 'set ThisBuild / Test / testOptions += Tests.Argument("-oD", "-u", "target/test-reports")' test
      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@d9f48fc87bc235f7e214acf696ca5abc0a986f16 # v6
        with:
          report_paths: '**/target/test-reports/**/*.xml'
          check_name: Test Results
          annotate_only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Stop MinIO
        if: always()
        run: docker rm -f minio || true

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Build docs assets
        run: ./sbt buildDocsAssets
      - name: Verify docs snippets
        run: ./sbt docs/mdoc checkDocSnippets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs dependencies
        run: npm ci --prefix docs
      - name: Build docs (verification only)
        run: npm run docs:build --prefix docs

  external-consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Publish locally and run a clean consumer project
        run: ./scripts/verify-external-consumer.sh

  packaged-server-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Assemble and exercise open and authenticated servers
        run: |
          ./sbt server/assembly
          ./scripts/smoke-packaged-server.sh
      - name: Prove filesystem backup and restore
        run: ./scripts/verify-backup-restore.sh

  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Check public compatibility against the latest release tag
        run: ./scripts/verify-version-compatibility.sh

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
