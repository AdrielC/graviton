global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: graviton

rule_files:
  - /etc/prometheus/recording-rules.yml
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: graviton
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ['graviton:8081']

# Replace this endpoint or remove remote_write for a self-contained cell.
remote_write:
  - url: 'http://metrics-gateway:8428/api/v1/write'
    queue_config:
      capacity: 10000
      max_shards: 20
      min_shards: 1
      max_samples_per_send: 2000
      batch_send_deadline: 5s
    metadata_config:
      send: true
