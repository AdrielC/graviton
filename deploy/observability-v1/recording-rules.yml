groups:
  - name: graviton-recording-v1
    interval: 15s
    rules:
      - record: graviton:slo:http_success_ratio_5m
        expr: 1 - (sum(rate(graviton_http_errors_total[5m])) / clamp_min(sum(rate(graviton_http_requests_total[5m])), 1))
      - record: graviton:slo:http_success_ratio_1h
        expr: 1 - (sum(rate(graviton_http_errors_total[1h])) / clamp_min(sum(rate(graviton_http_requests_total[1h])), 1))
      - record: graviton:slo:http_success_ratio_6h
        expr: 1 - (sum(rate(graviton_http_errors_total[6h])) / clamp_min(sum(rate(graviton_http_requests_total[6h])), 1))
      - record: graviton:slo:http_success_ratio_30d
        expr: 1 - (sum(rate(graviton_http_errors_total[30d])) / clamp_min(sum(rate(graviton_http_requests_total[30d])), 1))
      - record: graviton:slo:http_p50_seconds_5m
        expr: histogram_quantile(0.50, sum by (le) (rate(graviton_http_request_duration_seconds_bucket[5m])))
      - record: graviton:slo:http_p95_seconds_5m
        expr: histogram_quantile(0.95, sum by (le) (rate(graviton_http_request_duration_seconds_bucket[5m])))
      - record: graviton:slo:http_p99_seconds_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(graviton_http_request_duration_seconds_bucket[5m])))
      - record: graviton:slo:upload_p99_seconds_5m
        expr: histogram_quantile(0.99, sum by (le) (rate(graviton_blob_operation_duration_seconds_bucket{operation="put"}[5m])))
      - record: graviton:slo:s3_failure_ratio_5m
        expr: sum(rate(graviton_s3_api_calls_total{outcome="failure"}[5m])) / clamp_min(sum(rate(graviton_s3_api_calls_total[5m])), 1)
      - record: graviton:slo:postgres_pool_saturation
        expr: max by (pool) (graviton_postgres_pool_connections{state="active"}) / clamp_min(max by (pool) (graviton_postgres_pool_connections{state="maximum"}), 1)
      - record: graviton:slo:repair_backlog
        expr: max(graviton_replica_under_protected_blocks)
      - record: graviton:slo:deduplication_ratio_5m
        expr: sum(rate(graviton_fresh_block_bytes_total[5m]) + rate(graviton_duplicate_block_bytes_total[5m])) / clamp_min(sum(rate(graviton_fresh_block_bytes_total[5m])), 1)
      - record: graviton:traffic:delivered_egress_bytes_per_second_5m
        expr: sum(rate(graviton_delivered_egress_bytes_total[5m]))
      - record: graviton:traffic:quota_rejections_per_second_5m
        expr: sum by (kind) (rate(graviton_traffic_quota_rejections_total[5m]))
      - record: graviton:maintenance:failure_ratio_15m
        expr: sum(rate(graviton_maintenance_cycles_total{outcome="failed"}[15m])) / clamp_min(sum(rate(graviton_maintenance_cycles_total[15m])), 1)
