syntax = "proto3";

package io.graviton.blobstore.v1;

option java_multiple_files = true;
option java_package = "io.graviton.blobstore.v1";
option java_outer_classname = "BlobServiceProto";

message BlobKey {
  string value = 1;
}

message PutBlobMetadata {
  optional uint64 expected_size = 1;
  string content_type = 2;
}

message PutBlobRequest {
  oneof kind {
    PutBlobMetadata metadata = 1;
    bytes data = 2;
  }
}

message PutBlobResponse {
  BlobKey key = 1;
  uint64 size = 2;
  string content_type = 3;
}

message GetBlobRequest {
  BlobKey key = 1;
}

message BlobChunk {
  bytes data = 1;
  uint64 offset = 2;
}

message StatBlobResponse {
  uint64 size = 1;
  string digest = 2;
  int64 last_modified_epoch_millis = 3;
}

message ListBlobsRequest {}

message BlobSummary {
  BlobKey key = 1;
  uint64 size = 2;
  string digest = 3;
  int64 last_modified_epoch_millis = 4;
  uint32 block_count = 5;
}

message InspectBlobRequest {
  BlobKey key = 1;
}

message BlobBlock {
  uint64 index = 1;
  string key = 2;
  uint64 offset = 3;
  uint64 size = 4;
}

message DeleteBlobRequest {
  BlobKey key = 1;
}

message DeleteBlobResponse {}

service BlobService {
  rpc PutBlob(stream PutBlobRequest) returns (PutBlobResponse);
  rpc GetBlob(GetBlobRequest) returns (stream BlobChunk);
  rpc StatBlob(BlobKey) returns (StatBlobResponse);
  rpc ListBlobs(ListBlobsRequest) returns (stream BlobSummary);
  rpc InspectBlob(InspectBlobRequest) returns (stream BlobBlock);
  rpc DeleteBlob(DeleteBlobRequest) returns (DeleteBlobResponse);
}
